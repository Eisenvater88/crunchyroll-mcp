[package]
name = "crunchyroll-mcp"
version = "0.1.0"
edition = "2024"
description = "MCP-Server für Crunchyroll (Suche, Katalog, Watchlist, Release-Kalender) auf Basis von crunchyroll-rs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Eisenvater88/crunchyroll-mcp"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
crunchyroll-rs = { version = "0.19.1", features = ["release-calendar"] }
dirs = "7.0.0"
futures-util = "0.3.34"
rmcp = { version = "3.5.0", features = ["schemars", "server", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
