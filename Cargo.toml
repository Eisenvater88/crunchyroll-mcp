[package]
name = "crunchyroll-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
crunchyroll-rs = "0.18.0"
dirs = "6.0.0"
futures-util = "0.3.32"
rmcp = { version = "2.2.0", features = ["schemars", "server", "transport-io"] }
schemars = "1.2.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
